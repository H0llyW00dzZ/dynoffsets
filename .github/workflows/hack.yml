name: 🧪 CI (Windows only)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.ignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.ignore'
      - '.github/dependabot.yml'

jobs:
  test:
    name: Test on ${{ matrix.os }} (Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        rust: [stable, beta, nightly, '1.72']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Test (stable / beta / nightly)
      if: ${{ matrix.rust != '1.72' }}
      run: cargo test --all-features

    # MSRV check: only verify the library itself compiles on 1.72.
    # Using `cargo build` (not `test`) so dev-dependencies are not resolved.
    - name: MSRV build check (1.72)
      if: ${{ matrix.rust == '1.72' }}
      run: cargo build --all-features --verbose
